<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta Pro Neon - Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ruleta-container">
        <div class="flecha"></div>
        <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <div class="controles">
        <div class="input-grupo">
            <label>Nombre:</label>
            <input type="text" id="inputNombre" placeholder="Ej: Agustín">
        </div>
        <div class="input-grupo">
            <label>Foto:</label>
            <input type="file" id="inputFoto" accept="image/*">
        </div>
        <button id="btnAgregar">✅ Añadir Participante</button>
        <button id="btnSpin">🎰 ¡GIRAR RULETA!</button>
        <button id="btnLimpiar">🗑️ Limpiar Todo</button>
        
        <div id="contenedorLista">
            <h3>Participantes:</h3>
            <div id="listaParticipantes"></div>
        </div>
    </div>

    <!-- Se actualizó el src para usar el archivo procesado -->
    <audio id="sonidoClic" src="clic_final.mp3" preload="auto"></audio>
    <audio id="sonidoGanador" src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663095102047/xjnLpnFYvnxhMrbG.mp3" preload="auto"></audio>

    <div id="ganadorModal">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="btnCerrarGanador">&times;</span>
            <div id="confeti" class="confeti-container"></div>
            <h1 class="titulo-ganador">¡TENEMOS GANADOR!</h1>
            <img id="ganadorFoto" src="" alt="Ganador" class="foto-ganadora-grande">
            <h2 id="ganadorNombre" class="nombre-ganador-grande">Nombre</h2>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
