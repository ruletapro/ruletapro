<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta Pro - Neon Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ruleta-container">
        <div class="flecha"></div>
        <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <div class="controles">
        <div class="input-grupo">
            <label>Nombre:</label>
            <input type="text" id="inputNombre" placeholder="Ej: Agustín">
        </div>
        <div class="input-grupo">
            <label>Foto:</label>
            <input type="file" id="inputFoto" accept="image/*">
        </div>
        <button id="btnAgregar">✅ Añadir Participante</button>
        <button id="btnSpin">🎰 ¡GIRAR RULETA!</button>
        <button id="btnLimpiar">🗑️ Limpiar Todo</button>
        
        <div id="contenedorLista">
            <h3>Lista de Participantes:</h3>
            <div id="listaParticipantes"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
